name: birikim_portfoy
description: Ev kullanıcısına yönelik birikim ve portföy takip uygulaması.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  cached_network_image: ^3.3.1
  local_auth: ^3.0.1
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.6
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

