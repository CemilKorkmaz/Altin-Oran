name: Flutter Android checks
on:
  push:
    branches: ["arena/f284a20c-altin-oran"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested APK as a prerelease
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AltinOran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      - name: Check live API availability
        run: python3 tool/check_live_apis.py
      - name: Flutter tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("test-output.txt").read_text()[-3500:]; print("::error::" + s.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
          fi
          exit "$code"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: altin-oran-test-apk
          path: AltinOran/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish test release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/arena/f284a20c-altin-oran'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=v0.2.0-test.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk#Altin-Oran-test.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Altın Oran 0.2.0 — Yeni tasarım test sürümü" \
            --notes-file ../RELEASE-NOTES.md
