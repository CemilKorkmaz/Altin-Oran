name: Flutter Android checks
on:
  push:
    branches: ["arena/f284a20c-altin-oran"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AltinOran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: altin-oran-test-apk
          path: AltinOran/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f284a20c-altin-oran'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=v0.1.0-test.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk#Altin-Oran-test.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Altın Oran 0.1.0 — Test sürümü" \
            --notes-file ../RELEASE-NOTES.md
