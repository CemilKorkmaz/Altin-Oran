name: Flutter Android checks
on:
  push:
    branches: ["arena/f284a20c-altin-oran"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AltinOran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: altin-oran-test-apk
          path: AltinOran/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
